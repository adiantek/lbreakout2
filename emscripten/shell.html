<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBreakout2</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #000; --fg: #ccc; --accent: #e8b23a; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, sans-serif;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* keep 4:3 and fill the window; the game renders at 640x480 */
  #canvas {
    display: block; outline: none; background: #000;
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center;
    background: var(--bg); text-align: center; padding: 16px;
  }
  #overlay[hidden] { display: none; }
  #title { font-size: 28px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
  #progress { width: min(320px, 80vw); height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  #bar { width: 0; height: 100%; background: var(--accent); transition: width .1s; }
  #restart {
    font: inherit; color: var(--bg); background: var(--accent);
    border: 0; border-radius: 4px; padding: 8px 18px; cursor: pointer;
  }
  #restart[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="640" height="480" tabindex="-1"></canvas>
</div>
<div id="overlay">
  <div id="title">LBreakout2</div>
  <div id="status">Loading…</div>
  <div id="progress"><div id="bar"></div></div>
  <button id="restart" hidden>Play again</button>
</div>
<script>
  var canvas = document.getElementById('canvas');
  var overlay = document.getElementById('overlay');
  var statusEl = document.getElementById('status');
  var progressEl = document.getElementById('progress');
  var bar = document.getElementById('bar');
  var restart = document.getElementById('restart');

  function showMessage(text, canRestart) {
    overlay.hidden = false;
    statusEl.textContent = text;
    progressEl.hidden = true;
    restart.hidden = !canRestart;
  }
  restart.addEventListener('click', function () { location.reload(); });

  // the right mouse button fires the right weapon
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // keep keys like space and the arrows from scrolling the page
  window.addEventListener('keydown', function (e) {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
         'Backspace', 'Tab', 'PageUp', 'PageDown'].indexOf(e.key) >= 0)
      e.preventDefault();
  });
  canvas.addEventListener('mousedown', function () { canvas.focus(); });

  var Module = {
    canvas: canvas,
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    setStatus: function (text) {
      if (!text) { overlay.hidden = true; canvas.focus(); return; }
      var m = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) bar.style.width = (100 * m[1] / m[2]) + '%';
      statusEl.textContent = text.replace(/\(.*\)/, '').trim() || 'Loading…';
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
    },
    onExit: function () { showMessage('Thanks for playing LBreakout2!', true); },
    onAbort: function () { showMessage('LBreakout2 crashed. See the browser console for details.', true); }
  };
  Module.setStatus('Downloading…');
  window.addEventListener('error', function () {
    if (!overlay.hidden) return;
    showMessage('An error occurred. See the browser console for details.', true);
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
